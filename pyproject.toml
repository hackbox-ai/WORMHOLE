[project]
name = "wormhole"
version = "1.0.0"
description = "虫洞 Wormhole — 面向复杂攻击链的图谱认知渗透智能体"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
  { name = "Wormhole" },
]
keywords = [
  "cybersecurity",
  "pentest",
  "agent",
  "ai",
  "ctf",
  "benchmark",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.7",
]

[project.urls]
Homepage = "https://github.com/yourname/wormhole"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wormhole"]
